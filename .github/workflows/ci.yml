name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust 1.94.1
        run: |
          rustup toolchain install 1.94.1 --profile minimal
      - name: Install pinned MoonBit compiler and matching core
        run: |
          python3 scripts/bootstrap.py --prefix "$RUNNER_TEMP/moonfst-moon"
          echo "$RUNNER_TEMP/moonfst-moon/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$RUNNER_TEMP/moonfst-moon" >> "$GITHUB_ENV"
      - name: Fresh checkout acceptance, archive and consumer verification
        run: bash scripts/reproduce.sh
      - name: Validation must not modify tracked files
        run: git diff --exit-code
      - name: Preserve toolchain and LOC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: oracle/target/validation/
          if-no-files-found: warn
